version: 2
models:
  - name: customers
    description: Customer mart
    columns:
      - name: customer_id
      - name: first_name
      - name: last_name   # inherited later
      - name: created_at
      - name: number_of_orders
        description: Number of orders placed by the customer
  - name: orders
    description: Order mart
    columns:
      - name: order_id
      - name: customer_id
        description: Customer id
      - name: order_date
      - name: status
      - name: amount
